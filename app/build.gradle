plugins {
    id 'com.android.application'
}

// Release signing material lives outside git (keystore.properties is ignored).
// When it is missing the release build must fail, never fall back to the debug key.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.scrollguard'
    compileSdk 34

    defaultConfig {
        applicationId "com.scrollguard"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "0.0.6 测试版"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                // Robolectric downloads its android-all jar at test runtime;
                // direct TLS to maven is unreliable on this machine.
                systemProperty 'http.proxyHost', '127.0.0.1'
                systemProperty 'http.proxyPort', '7897'
                systemProperty 'https.proxyHost', '127.0.0.1'
                systemProperty 'https.proxyPort', '7897'
                testLogging {
                    events 'passed', 'failed', 'skipped'
                    exceptionFormat 'full'
                }
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
